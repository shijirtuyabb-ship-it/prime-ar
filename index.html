<!DOCTYPE html>
<html lang="mn">
<head>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js" } }
</script>
<style>
:root { --bg:#0b0b11; --line:rgba(255,255,255,0.08); --muted:#a3a3b2; --gold:#c9a45c; --gold-2:#dbb975 }
* { box-sizing:border-box; margin:0; padding:0 }
html, body { height:100%; background:var(--bg); color:#fff; overflow:hidden }
body { font-family:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing:antialiased }
#cam, #stage { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; display:block }
#cam { background:#000 }
#stage { pointer-events:none }
.top { position:fixed; z-index:5; top:calc(env(safe-area-inset-top) + 14px); left:16px; display:flex; align-items:center; gap:9px; padding:8px 14px 8px 9px; border-radius:999px; background:rgba(12,12,18,.6); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); border:1px solid var(--line); font-weight:600; font-size:15px }
.orb { width:22px; height:22px; border-radius:6px; background:linear-gradient(145deg,#f0d9a4,#c9a45c 45%,#8a6a2c) }
.hint { position:fixed; z-index:5; left:50%; bottom:calc(env(safe-area-inset-bottom) + 26px); transform:translateX(-50%); max-width:calc(100% - 32px); padding:12px 18px; border-radius:999px; background:rgba(12,12,18,.66); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); border:1px solid var(--line); font-size:15px; font-weight:500; text-align:center; transition:opacity .4s }
.hint.hide { opacity:0 }
.frame { position:fixed; z-index:4; left:50%; top:50%; width:min(62vw,62vh); aspect-ratio:1; transform:translate(-50%,-50%); pointer-events:none; transition:opacity .4s }
.frame.hide { opacity:0 }
.frame i { position:absolute; width:16%; height:16%; border:2px solid var(--gold-2); filter:drop-shadow(0 0 6px rgba(219,185,117,.6)) }
.frame i:nth-child(1) { top:0; left:0; border-right:0; border-bottom:0; border-top-left-radius:14px }
.frame i:nth-child(2) { top:0; right:0; border-left:0; border-bottom:0; border-top-right-radius:14px }
.frame i:nth-child(3) { bottom:0; left:0; border-right:0; border-top:0; border-bottom-left-radius:14px }
.frame i:nth-child(4) { bottom:0; right:0; border-left:0; border-top:0; border-bottom-right-radius:14px }
.start { position:fixed; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:32px 24px; background:radial-gradient(120% 80% at 50% 0%, #15161f 0%, var(--bg) 60%) }
.start.hide { display:none }
.start h1 { font-size:clamp(34px,9vw,54px); line-height:1.05; font-weight:700; letter-spacing:-0.025em }
.start p { margin-top:16px; color:var(--muted); font-size:17px; line-height:1.55; max-width:360px }
.start button { margin-top:28px; height:56px; padding:0 34px; border:0; border-radius:999px; background:linear-gradient(180deg,var(--gold-2),var(--gold)); color:#15120a; font:600 18px "Inter",system-ui,sans-serif; box-shadow:inset 0 1px 0 rgba(255,255,255,.3); cursor:pointer }
.start .err { color:#ffb4a8; display:none }
.start .err.show { display:block }
</style>
</head>
<body>
<video id="cam" playsinline muted autoplay></video>
<canvas id="stage" aria-hidden="true"></canvas>
<div class="top"><span class="orb"></span>Prime Business Center</div>
<div class="frame hide" id="frame"><i></i><i></i><i></i><i></i></div>
<div class="hint hide" id="hint">Камераа QR код руу чиглүүлнэ үү</div>

<div class="start" id="start">
  <h1>Prime<br />Business Center</h1>
  <p>Камераа асаагаад QR код руу чиглүүлэхэд барилга QR дээрээс босож харагдана.</p>
  <button id="go" type="button">Камер асаах</button>
  <p class="err" id="err"></p>
</div>

<script type="module">
import * as THREE from "three";

const video = document.getElementById("cam"), canvas = document.getElementById("stage");
const startEl = document.getElementById("start"), goBtn = document.getElementById("go"), errEl = document.getElementById("err");
const hintEl = document.getElementById("hint"), frameEl = document.getElementById("frame");

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: "high-performance" });
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.localClippingEnabled = true;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 500);   // sits at the origin, looks down -Z

/* ---------- helpers ---------- */
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function canvasTex(c) { const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; }
function radialTexture(stops, size = 256) {
  const c = document.createElement("canvas"); c.width = c.height = size;
  const g = c.getContext("2d"), gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  stops.forEach(([o, col]) => gr.addColorStop(o, col));
  g.fillStyle = gr; g.fillRect(0, 0, size, size);
  return canvasTex(c);
}
function rrShape(w, d, r) {
  const s = new THREE.Shape(), x = -w / 2, y = -d / 2, P = Math.PI;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.absarc(x + w - r, y + r, r, -P / 2, 0, false);
  s.lineTo(x + w, y + d - r); s.absarc(x + w - r, y + d - r, r, 0, P / 2, false);
  s.lineTo(x + r, y + d); s.absarc(x + r, y + d - r, r, P / 2, P, false);
  s.lineTo(x, y + r); s.absarc(x + r, y + r, r, P, P * 1.5, false);
  return s;
}
function slab(w, d, r, h) {
  const g = new THREE.ExtrudeGeometry(rrShape(w, d, r), { depth: h, bevelEnabled: false, curveSegments: 12 });
  g.rotateX(-Math.PI / 2); return g;           // base at y=0, top at y=h
}

const glowTex = radialTexture([[0, "rgba(150,190,255,1)"], [0.25, "rgba(80,130,255,.55)"], [0.6, "rgba(50,90,230,.12)"], [1, "rgba(30,60,200,0)"]]);
const warmTex = radialTexture([[0, "rgba(255,225,170,1)"], [0.3, "rgba(219,185,117,.5)"], [0.65, "rgba(201,164,92,.1)"], [1, "rgba(201,164,92,0)"]]);

/* ---------- daylight sky for reflections (from the Prime Tower Model page) ---------- */
  function makeSkyEnv() {
    const envScene = new THREE.Scene();
    const geo = new THREE.SphereGeometry(1, 48, 24);
    const mat = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      depthWrite: false,
      uniforms: {
        zenith: { value: new THREE.Color(0x4f86c6) },
        horizon: { value: new THREE.Color(0xeaf1f7) },
        ground: { value: new THREE.Color(0x7c7a74) },
      },
      vertexShader: 'varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
      fragmentShader: `
        uniform vec3 zenith; uniform vec3 horizon; uniform vec3 ground; varying vec3 vDir;
        void main(){
          float h = vDir.y;
          vec3 c = h > 0.0 ? mix(horizon, zenith, pow(h, 0.55)) : mix(horizon, ground, pow(-h, 0.4));
          gl_FragColor = vec4(c, 1.0);
        }`,
    });
    envScene.add(new THREE.Mesh(geo, mat));
    const pmrem = new THREE.PMREMGenerator(renderer);
    const tex = pmrem.fromScene(envScene, 0.02).texture;
    pmrem.dispose();
    return tex;
  }
  scene.environment = makeSkyEnv();

/* ---------- rig ---------- */
const site = new THREE.Group(); scene.add(site);        // follows the QR code
const building = new THREE.Group(); site.add(building);
const sun = new THREE.DirectionalLight(0xfff2de, 2.4); sun.position.set(-3, 6, 3); site.add(sun, sun.target);
site.add(new THREE.HemisphereLight(0xdfe9f5, 0x8a8478, 0.7));
const clip = new THREE.Plane(new THREE.Vector3(0, -1, 0), 0);   // rises during the intro
const srgb = (r, g, b) => new THREE.Color().setRGB(r / 255, g / 255, b / 255, THREE.SRGBColorSpace);
const allMaterials = [];

  // ---------- Tower and podium redesigned from the client's render (world millimetres, y up) ----------
  const T = { x0: 140700, x1: 165650, z0: -147000, z1: -118050, y0: 1350, gf: 6350, floors: 14, fh: 3200 };
  T.top = T.gf + T.floors * T.fh;
  const TR = { ne: 9500, se: 3000, sw: 1500, nw: 1500 };
  const P = { x0: 134600, x1: 159600, z0: -130500, z1: -108400, y0: 1350, floors: 4, fh: 3850 };
  P.top = P.y0 + P.floors * P.fh;

  function seeded(seed) {
    return () => {
      seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function canvasPair(w, h, draw) {
    const color = document.createElement('canvas');
    const mr = document.createElement('canvas');
    color.width = mr.width = w;
    color.height = mr.height = h;
    draw(color.getContext('2d'), mr.getContext('2d'), w, h);
    const map = new THREE.CanvasTexture(color);
    map.colorSpace = THREE.SRGBColorSpace;
    const mrMap = new THREE.CanvasTexture(mr);
    for (const t of [map, mrMap]) {
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    }
    return { map, mrMap };
  }

  // roughness in the green channel, metalness in the blue channel (three.js convention)
  const mr = (rough, metal) => `rgb(0, ${Math.round(rough * 255)}, ${Math.round(metal * 255)})`;

  function fillBoth(c, m, color, rough, metal, x, y, w, h) {
    c.fillStyle = color; c.fillRect(x, y, w, h);
    m.fillStyle = mr(rough, metal); m.fillRect(x, y, w, h);
  }

  function glassGradient(c, x, y, w, h, top, bottom) {
    const g = c.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, top); g.addColorStop(1, bottom);
    c.fillStyle = g; c.fillRect(x, y, w, h);
  }

  const STONE = 'rgb(176, 158, 142)';

  // One window bay of one storey: taupe stone with a punched, framed window.
  const stoneWindowTex = canvasPair(256, 256, (c, m, w, h) => {
    fillBoth(c, m, STONE, 0.8, 0, 0, 0, w, h);
    const rnd = seeded(7);
    for (let i = 0; i < 900; i++) {
      const s = 0.9 + rnd() * 0.18;
      c.fillStyle = `rgba(${Math.round(176 * s)}, ${Math.round(158 * s)}, ${Math.round(142 * s)}, 0.35)`;
      c.fillRect(rnd() * w, rnd() * h, 2 + rnd() * 6, 1 + rnd() * 3);
    }
    c.fillStyle = 'rgb(150, 135, 122)';
    c.fillRect(0, h - 3, w, 3);
    c.fillRect(0, Math.round(h * 0.5), w, 1);
    const wx = w * 0.24, ww = w * 0.52, wy = h * 0.1, wh = h * 0.62;
    c.fillStyle = 'rgb(122, 110, 100)';
    c.fillRect(wx - 6, wy - 6, ww + 10, wh + 10);
    fillBoth(c, m, 'rgb(206, 204, 199)', 0.35, 0.6, wx, wy, ww, wh);
    glassGradient(c, wx + 7, wy + 7, ww - 14, wh - 14, 'rgb(72, 108, 144)', 'rgb(30, 52, 76)');
    m.fillStyle = mr(0.04, 1); m.fillRect(wx + 7, wy + 7, ww - 14, wh - 14);
    fillBoth(c, m, 'rgb(206, 204, 199)', 0.35, 0.6, wx + 7, wy + wh * 0.68, ww - 14, 4);
    fillBoth(c, m, 'rgb(228, 222, 212)', 0.6, 0, wx - 8, wy + wh, ww + 16, 6);
  });

  // Curtain-wall module: dark blue reflective glass with slim mullions and a spandrel at the slab.
  function curtainTex(spandrel, mullion) {
    return canvasPair(128, 256, (c, m, w, h) => {
      glassGradient(c, 0, 0, w, h, 'rgb(78, 118, 158)', 'rgb(30, 56, 86)');
      m.fillStyle = mr(0.04, 1); m.fillRect(0, 0, w, h);
      fillBoth(c, m, 'rgb(26, 34, 44)', 0.2, 0.9, 0, h * (1 - spandrel), w, h * spandrel);
      fillBoth(c, m, mullion, 0.3, 0.8, 0, h * (1 - spandrel) - 3, w, 3);
      fillBoth(c, m, mullion, 0.3, 0.8, 0, 0, 4, h);
    });
  }
  const bayTex = curtainTex(0.08, 'rgb(150, 160, 170)');
  const podiumTex = curtainTex(0.14, 'rgb(170, 160, 150)');

  const storefrontTex = canvasPair(256, 256, (c, m, w, h) => {
    glassGradient(c, 0, 0, w, h, 'rgb(78, 112, 146)', 'rgb(34, 56, 80)');
    m.fillStyle = mr(0.05, 1); m.fillRect(0, 0, w, h);
    fillBoth(c, m, 'rgb(64, 66, 70)', 0.4, 0.7, 0, 0, 8, h);
    fillBoth(c, m, 'rgb(64, 66, 70)', 0.4, 0.7, 0, h * 0.22, w, 6);
    fillBoth(c, m, 'rgb(64, 66, 70)', 0.4, 0.7, 0, h - 10, w, 10);
  });

  const pavingTex = canvasPair(256, 256, (c, m, w, h) => {
    fillBoth(c, m, 'rgb(176, 124, 96)', 0.9, 0, 0, 0, w, h);
    const rnd = seeded(3);
    for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) {
      const s = 0.9 + rnd() * 0.15;
      c.fillStyle = `rgb(${Math.round(176 * s)}, ${Math.round(124 * s)}, ${Math.round(96 * s)})`;
      c.fillRect(x * 64 + 2, y * 64 + 2, 60, 60);
    }
  });

  function texturedMaterial(t, extra = {}) {
    const mat = new THREE.MeshStandardMaterial({
      map: t.map, roughnessMap: t.mrMap, metalnessMap: t.mrMap,
      roughness: 1, metalness: 1, envMapIntensity: 1.25, ...extra,
    });
    allMaterials.push(mat);
    return mat;
  }
  function plainMaterial(r, g, b, rough, metal = 0, extra = {}) {
    const mat = new THREE.MeshStandardMaterial({ color: srgb(r, g, b), roughness: rough, metalness: metal, ...extra });
    allMaterials.push(mat);
    return mat;
  }

  function stripGeometry(points, y0, y1, uScale, vScale) {
    const n = points.length;
    const pos = new Float32Array(n * 6), nor = new Float32Array(n * 6), uv = new Float32Array(n * 4);
    points.forEach((p, i) => {
      const u = p.s / uScale;
      pos.set([p.x, y0, p.z, p.x, y1, p.z], i * 6);
      nor.set([p.nx, 0, p.nz, p.nx, 0, p.nz], i * 6);
      uv.set([u, 0, u, (y1 - y0) / vScale], i * 4);
    });
    const idx = [];
    for (let i = 0; i < n - 1; i++) {
      const b = i * 2;
      idx.push(b, b + 2, b + 3, b, b + 3, b + 1);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
    geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
    geo.setIndex(idx);
    return geo;
  }

  const facePts = (ax, az, bx, bz, nx, nz) => {
    const len = Math.hypot(bx - ax, bz - az);
    return { len, pts: [{ x: ax, z: az, nx, nz, s: 0 }, { x: bx, z: bz, nx, nz, s: len }] };
  };
  const arcPts = (cx, cz, r, t0, t1, steps = 28) => {
    const pts = [];
    for (let i = 0; i <= steps; i++) {
      const t = t0 + ((t1 - t0) * i) / steps;
      pts.push({ x: cx + r * Math.cos(t), z: cz + r * Math.sin(t), nx: Math.cos(t), nz: Math.sin(t), s: r * Math.abs(t - t0) });
    }
    return { len: r * Math.abs(t1 - t0), pts };
  };
  const evenCell = (len, cell) => len / Math.max(1, Math.round(len / cell));
  const D = Math.PI / 180;

  function roundedRectShape(x0, x1, z0, z1, r) {
    // shape space: (x, -z) so that rotating by -90deg about X maps it back onto the ground plane
    const s = new THREE.Shape();
    const sy0 = -z1, sy1 = -z0;
    s.moveTo(x0 + r.nw, sy0);
    s.lineTo(x1 - r.ne, sy0);
    s.absarc(x1 - r.ne, sy0 + r.ne, r.ne, -Math.PI / 2, 0, false);
    s.lineTo(x1, sy1 - r.se);
    s.absarc(x1 - r.se, sy1 - r.se, r.se, 0, Math.PI / 2, false);
    s.lineTo(x0 + r.sw, sy1);
    s.absarc(x0 + r.sw, sy1 - r.sw, r.sw, Math.PI / 2, Math.PI, false);
    s.lineTo(x0, sy0 + r.nw);
    s.absarc(x0 + r.nw, sy0 + r.nw, r.nw, Math.PI, Math.PI * 1.5, false);
    return s;
  }

  function sectorShape(cx, cz, ri, ro, t0, t1) {
    // world angles t (x = cos t, z = sin t) become -t in shape space
    const s = new THREE.Shape();
    const a0 = -t1, a1 = -t0;
    s.moveTo(cx + ro * Math.cos(a0), -cz + ro * Math.sin(a0));
    s.absarc(cx, -cz, ro, a0, a1, false);
    s.lineTo(cx + ri * Math.cos(a1), -cz + ri * Math.sin(a1));
    s.absarc(cx, -cz, ri, a1, a0, true);
    return s;
  }

  function flatExtrude(shape, depth, y, mat, bevel = 0) {
    const geo = new THREE.ExtrudeGeometry(shape, {
      depth, curveSegments: 32,
      bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 3,
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.rotation.x = -Math.PI / 2;
    mesh.position.y = y + bevel;
    return mesh;
  }

  function box(w, h, d, x, y, z, mat) {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    mesh.position.set(x, y + h / 2, z);
    return mesh;
  }

  function signTexture(text, sub, panel) {
    const c = document.createElement('canvas');
    c.width = 1024; c.height = 256;
    const g = c.getContext('2d');
    if (panel) { g.fillStyle = panel; g.fillRect(0, 0, 1024, 256); }
    const gold = g.createLinearGradient(0, 40, 0, 200);
    gold.addColorStop(0, '#f1d58a'); gold.addColorStop(1, '#b58a2e');
    g.fillStyle = gold;
    g.beginPath();
    g.moveTo(150, 52); g.lineTo(200, 128); g.lineTo(150, 204); g.lineTo(100, 128); g.closePath(); g.fill();
    g.fillStyle = panel || 'rgba(0,0,0,0)';
    if (panel) { g.beginPath(); g.moveTo(150, 92); g.lineTo(174, 128); g.lineTo(150, 164); g.lineTo(126, 128); g.closePath(); g.fill(); }
    g.fillStyle = gold;
    g.font = '700 128px Georgia, "Times New Roman", serif';
    g.textBaseline = 'alphabetic';
    g.fillText(text, 240, 168);
    if (sub) {
      g.font = '500 34px Georgia, serif';
      g.fillText(sub, 248, 220);
    }
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = 8;
    return t;
  }

  function tree(x, y, z, scale, leafMat, trunkMat) {
    const g = new THREE.Group();
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(140 * scale, 200 * scale, 2600 * scale, 7), trunkMat);
    trunk.position.y = 1300 * scale;
    const crown = new THREE.Mesh(new THREE.IcosahedronGeometry(1800 * scale, 1), leafMat);
    crown.position.y = 3600 * scale;
    crown.scale.set(1, 1.15, 1);
    g.add(trunk, crown);
    g.position.set(x, y, z);
    return g;
  }

  function buildRenderedBuilding() {
    const g = new THREE.Group();
    const stoneWin = texturedMaterial(stoneWindowTex, { envMapIntensity: 1.1 });
    const bayGlass = texturedMaterial(bayTex, { envMapIntensity: 1.6 });
    const podiumGlass = texturedMaterial(podiumTex, { envMapIntensity: 1.5 });
    const storefront = texturedMaterial(storefrontTex, { envMapIntensity: 1.4 });
    const stone = plainMaterial(176, 158, 142, 0.78);
    const slate = plainMaterial(66, 69, 76, 0.5, 0.12, { envMapIntensity: 0.8 });
    const canopy = plainMaterial(44, 48, 54, 0.5, 0.4);
    const lawn = plainMaterial(104, 150, 64, 1);
    const leaf = plainMaterial(70, 112, 50, 0.95, 0, { flatShading: true });
    const trunk = plainMaterial(92, 72, 56, 1);
    const flowersA = plainMaterial(232, 150, 46, 0.9);
    const flowersB = plainMaterial(238, 204, 70, 0.9);
    const planter = plainMaterial(120, 110, 102, 0.85);

    // Tower walls: stone with punched windows on the straight faces, a curved glass bay at the north-east corner.
    const segs = [
      { kind: 'face', ...facePts(T.x0 + TR.nw, T.z1, T.x1 - TR.ne, T.z1, 0, 1) },
      { kind: 'bay', ...arcPts(T.x1 - TR.ne, T.z1 - TR.ne, TR.ne, 90 * D, 0) },
      { kind: 'face', ...facePts(T.x1, T.z1 - TR.ne, T.x1, T.z0 + TR.se, 1, 0) },
      { kind: 'corner', ...arcPts(T.x1 - TR.se, T.z0 + TR.se, TR.se, 0, -90 * D, 10) },
      { kind: 'face', ...facePts(T.x1 - TR.se, T.z0, T.x0 + TR.sw, T.z0, 0, -1) },
      { kind: 'corner', ...arcPts(T.x0 + TR.sw, T.z0 + TR.sw, TR.sw, -90 * D, -180 * D, 8) },
      { kind: 'face', ...facePts(T.x0, T.z0 + TR.sw, T.x0, T.z1 - TR.nw, -1, 0) },
      { kind: 'corner', ...arcPts(T.x0 + TR.nw, T.z1 - TR.nw, TR.nw, 180 * D, 90 * D, 8) },
    ];
    for (const s of segs) {
      const upperMat = s.kind === 'face' ? stoneWin : bayGlass;
      const upperCell = s.kind === 'face' ? 3200 : 1500;
      g.add(new THREE.Mesh(stripGeometry(s.pts, T.gf, T.top, evenCell(s.len, upperCell), T.fh), upperMat));
      const lowerMat = s.kind === 'corner' ? stone : storefront;
      g.add(new THREE.Mesh(stripGeometry(s.pts, T.y0, T.gf, evenCell(s.len, 2500), T.gf - T.y0), lowerMat));
    }
    const lid = flatExtrude(roundedRectShape(T.x0, T.x1, T.z0, T.z1, TR), 200, T.top - 200, stone);
    g.add(lid);

    // Overhanging dark roof cap with rounded corners.
    const o = 900;
    const capRadii = { ne: TR.ne + o, se: TR.se + o, sw: TR.sw + o, nw: TR.nw + o };
    g.add(flatExtrude(roundedRectShape(T.x0 - o, T.x1 + o, T.z0 - o, T.z1 + o, capRadii), 1300, T.top, slate, 150));

    // Entrance canopy wrapping the glass bay, sign above it, flower beds in front.
    const bayC = { x: T.x1 - TR.ne, z: T.z1 - TR.ne };
    g.add(flatExtrude(sectorShape(bayC.x, bayC.z, TR.ne, TR.ne + 3200, 4 * D, 86 * D), 450, T.gf, canopy));
    const entrySign = new THREE.Mesh(
      new THREE.PlaneGeometry(6400, 1600),
      new THREE.MeshStandardMaterial({ map: signTexture('PRIME', 'BUSINESS CENTER', '#2b2f36'), roughness: 0.5, metalness: 0.2 })
    );
    const a45 = 45 * D;
    entrySign.position.set(bayC.x + (TR.ne + 60) * Math.cos(a45), T.gf + 450 + 900, bayC.z + (TR.ne + 60) * Math.sin(a45));
    entrySign.rotation.y = Math.atan2(Math.cos(a45), Math.sin(a45));
    g.add(entrySign);
    g.add(flatExtrude(sectorShape(bayC.x, bayC.z, TR.ne + 3800, TR.ne + 5400, 14 * D, 76 * D), 550, T.y0, flowersA));
    g.add(flatExtrude(sectorShape(bayC.x, bayC.z, TR.ne + 5400, TR.ne + 6400, 18 * D, 72 * D), 450, T.y0, flowersB));

    const topSign = new THREE.Mesh(
      new THREE.PlaneGeometry(6000, 1500),
      new THREE.MeshStandardMaterial({ map: signTexture('PRIME', null, null), transparent: true, roughness: 0.35, metalness: 0.8 })
    );
    topSign.position.set(T.x1 + 40, T.top - 2300, T.z1 - TR.ne - 4200);
    topSign.rotation.y = Math.PI / 2;
    g.add(topSign);

    // Podium: four-storey glass box with stone corner piers, parapet and a roof garden.
    const pSegs = [
      facePts(P.x0, P.z1, P.x1, P.z1, 0, 1),
      facePts(P.x1, P.z1, P.x1, P.z0, 1, 0),
      facePts(P.x1, P.z0, P.x0, P.z0, 0, -1),
      facePts(P.x0, P.z0, P.x0, P.z1, -1, 0),
    ];
    for (const s of pSegs) g.add(new THREE.Mesh(stripGeometry(s.pts, P.y0, P.top, evenCell(s.len, 1800), P.fh), podiumGlass));
    const pierH = P.top - P.y0 + 1200;
    for (const [x, z] of [[P.x1, P.z1], [P.x0, P.z1], [P.x0, P.z0]]) g.add(box(1300, pierH, 1300, x, P.y0, z, stone));
    for (let x = P.x0 + 6200; x < P.x1 - 3000; x += 6200) g.add(box(700, pierH, 700, x, P.y0, P.z1, stone));
    g.add(box(P.x1 - P.x0 + 600, 900, 900, (P.x0 + P.x1) / 2, P.y0, P.z1, stone));
    g.add(box(900, 900, P.z1 - P.z0 + 600, P.x1, P.y0, (P.z0 + P.z1) / 2, stone));
    const pw = P.x1 - P.x0, pd = P.z1 - P.z0, cxp = (P.x0 + P.x1) / 2, czp = (P.z0 + P.z1) / 2;
    g.add(box(pw, 1200, 500, cxp, P.top, P.z1 - 250, stone));
    g.add(box(500, 1200, pd, P.x1 - 250, P.top, czp, stone));
    g.add(box(500, 1200, pd, P.x0 + 250, P.top, czp, stone));
    g.add(box(pw, 1200, 500, cxp, P.top, P.z0 + 250, stone));

    const paveMap = pavingTex.map.clone();
    paveMap.repeat.set(pw / 2400, pd / 2400);
    paveMap.needsUpdate = true;
    const paveMat = new THREE.MeshStandardMaterial({ map: paveMap, roughness: 0.9 });
    allMaterials.push(paveMat);
    const roofSlab = new THREE.Mesh(new THREE.PlaneGeometry(pw - 1000, pd - 1000), paveMat);
    roofSlab.rotation.x = -Math.PI / 2;
    roofSlab.position.set(cxp, P.top + 120, czp);
    g.add(roofSlab);
    g.add(box(pw, 120, pd, cxp, P.top, czp, stone));

    const lawnC = { x: 148500, z: -113300 };
    const disc = new THREE.Mesh(new THREE.CylinderGeometry(3300, 3300, 380, 48), lawn);
    disc.position.set(lawnC.x, P.top + 300, lawnC.z);
    g.add(disc);
    const discRim = new THREE.Mesh(new THREE.CylinderGeometry(3550, 3550, 300, 48), planter);
    discRim.position.set(lawnC.x, P.top + 260, lawnC.z);
    g.add(discRim);
    g.add(tree(lawnC.x, P.top + 490, lawnC.z, 0.75, leaf, trunk));

    for (let x = P.x0 + 1800; x < P.x1 - 7000; x += 2600) {
      g.add(box(1500, 600, 1100, x, P.top + 120, P.z1 - 1300, planter));
      const shrub = new THREE.Mesh(new THREE.IcosahedronGeometry(750, 1), leaf);
      shrub.position.set(x, P.top + 120 + 900, P.z1 - 1300);
      g.add(shrub);
    }
    for (let z = P.z0 + 2000; z < P.z1 - 2500; z += 2800) {
      g.add(box(1100, 600, 1500, P.x0 + 1300, P.top + 120, z, planter));
      g.add(tree(P.x0 + 1300, P.top + 720, z, 0.55, leaf, trunk));
    }
    g.add(box(4300, 3400, 3400, P.x1 - 3000, P.top + 120, T.z1 + 1900, slate));

    g.traverse((o2) => { if (o2.isMesh) { o2.castShadow = true; o2.receiveShadow = true; } });
    return g;
  }

/* place the tower (world millimetres) on the QR: footprint centred, ground at y = 0 */
const K = 3.8 / 40000;
const BH = (T.top + 1500 - T.y0) * K, TW = 3.0, TD = 3.7;
{
  const model = buildRenderedBuilding();
  model.traverse(o => { if (o.isMesh) for (const mt of [].concat(o.material)) mt.clippingPlanes = [clip]; });
  building.add(model);
  building.scale.setScalar(K);
  building.position.set(-150125 * K, -T.y0 * K, 127700 * K);
}

/* scan ring that rides the reveal edge */
const scanRing = new THREE.Group(); site.add(scanRing);
{
  const mk = (w, d, r, o) => {
    const pts = rrShape(w, d, r).getPoints(20).map(p => new THREE.Vector3(p.x, 0, p.y));
    return new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: new THREE.Color(2.6, 2.0, 1.0), transparent: true, opacity: o, toneMapped: false }));
  };
  scanRing.add(mk(TW + 0.5, TD + 0.5, 0.36, 1), mk(TW + 0.75, TD + 0.75, 0.46, 0.35));
  const glow = new THREE.Mesh(new THREE.PlaneGeometry(4.2, 4.2), new THREE.MeshBasicMaterial({ map: warmTex, transparent: true, opacity: 0.35, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false }));
  glow.rotation.x = -Math.PI / 2; scanRing.add(glow);
}


/* soft contact shadow so the tower sits on the paper */
{
  const sh = new THREE.Mesh(new THREE.PlaneGeometry(5.4, 5.0), new THREE.MeshBasicMaterial({ map: radialTexture([[0, "rgba(0,0,0,.55)"], [0.55, "rgba(0,0,0,.28)"], [1, "rgba(0,0,0,0)"]]), transparent: true, depthWrite: false, toneMapped: false }));
  sh.rotation.x = -Math.PI / 2; sh.position.set(-0.3, 0.004, 0.1); site.add(sh);
}
site.matrixAutoUpdate = false; site.visible = false;

/* ---------- camera ---------- */
let vw = 0, vh = 0, focal = 1;
async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } } });
  video.srcObject = stream; await video.play();
  await new Promise(r => { if (video.videoWidth) r(); else video.addEventListener("loadedmetadata", r, { once: true }); });
  sizeToVideo();
}
function sizeToVideo() {
  vw = video.videoWidth; vh = video.videoHeight; if (!vw) return;
  const rs = Math.min(1.5, 1280 / Math.max(vw, vh) * Math.min(devicePixelRatio, 2));
  renderer.setPixelRatio(1); renderer.setSize(Math.round(vw * rs), Math.round(vh * rs), false);
  focal = Math.max(vw, vh) * 0.78;                       // typical phone main camera (~65 deg on the long side)
  camera.fov = THREE.MathUtils.radToDeg(2 * Math.atan(vh / (2 * focal)));
  camera.aspect = vw / vh; camera.updateProjectionMatrix();
}
video.addEventListener("resize", sizeToVideo);

/* ---------- QR detection: corner points in video pixels (TL, TR, BR, BL) ---------- */
let native = null;
if ("BarcodeDetector" in window) { try { native = new BarcodeDetector({ formats: ["qr_code"] }); } catch (e) { native = null; } }
const work = document.createElement("canvas"), wctx = work.getContext("2d", { willReadFrequently: true });
async function detect() {
  if (native) {
    try { const r = await native.detect(video); if (r.length && r[0].cornerPoints && r[0].cornerPoints.length === 4) return r[0].cornerPoints.map(p => [p.x, p.y]); if (r.length === 0) return null; }
    catch (e) { native = null; }
  }
  if (typeof jsQR !== "function") return null;
  const s = Math.min(1, 640 / Math.max(vw, vh)), cw = Math.round(vw * s), ch = Math.round(vh * s);
  if (work.width !== cw) { work.width = cw; work.height = ch; }
  wctx.drawImage(video, 0, 0, cw, ch);
  const r = jsQR(wctx.getImageData(0, 0, cw, ch).data, cw, ch, { inversionAttempts: "dontInvert" });
  if (!r) return null;
  const L = r.location;
  return [L.topLeftCorner, L.topRightCorner, L.bottomRightCorner, L.bottomLeftCorner].map(p => [p.x / s, p.y / s]);
}

/* ---------- pose from the 4 corners (planar homography) ---------- */
const HALF = 2.1;                                         // the QR spans 4.2 units, tower footprint is 2.0
const SRC = [[-HALF, -HALF], [HALF, -HALF], [HALF, HALF], [-HALF, HALF]];   // (x, z) on the paper
function homography(src, dst) {
  const M = [];
  for (let i = 0; i < 4; i++) {
    const [u, v] = src[i], [x, y] = dst[i];
    M.push([u, v, 1, 0, 0, 0, -u * x, -v * x, x]);
    M.push([0, 0, 0, u, v, 1, -u * y, -v * y, y]);
  }
  for (let c = 0; c < 8; c++) {
    let p = c; for (let r = c + 1; r < 8; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
    if (Math.abs(M[p][c]) < 1e-10) return null;
    [M[c], M[p]] = [M[p], M[c]];
    for (let r = 0; r < 8; r++) if (r !== c) { const f = M[r][c] / M[c][c]; for (let k = c; k < 9; k++) M[r][k] -= f * M[c][k]; }
  }
  const h = M.map((row, i) => row[8] / row[i]);
  return [h[0], h[1], h[2], h[3], h[4], h[5], h[6], h[7], 1];
}
const tPos = new THREE.Vector3(), tQuat = new THREE.Quaternion(), pos = new THREE.Vector3(), quat = new THREE.Quaternion();
const vX = new THREE.Vector3(), vY = new THREE.Vector3(), vZ = new THREE.Vector3(), basis = new THREE.Matrix4();
function poseFrom(corners) {
  const h = homography(SRC, corners); if (!h) return false;
  const cx = vw / 2, cy = vh / 2;
  const col = j => new THREE.Vector3((h[j] - cx * h[6 + j]) / focal, (h[3 + j] - cy * h[6 + j]) / focal, h[6 + j]);
  const b1 = col(0), b2 = col(1), b3 = col(2);
  let lam = 2 / (b1.length() + b2.length()); if (b3.z * lam < 0) lam = -lam;
  vX.copy(b1).multiplyScalar(lam).normalize();
  vZ.copy(b2).multiplyScalar(lam); vZ.addScaledVector(vX, -vZ.dot(vX)).normalize();
  vY.crossVectors(vZ, vX);
  b3.multiplyScalar(lam);
  // OpenCV camera (y down, z forward) -> three.js camera (y up, z backward)
  for (const v of [vX, vY, vZ, b3]) { v.y = -v.y; v.z = -v.z; }
  if (!isFinite(b3.z) || b3.z > -0.5) return false;
  basis.makeBasis(vX, vY, vZ); tQuat.setFromRotationMatrix(basis); tPos.copy(b3);
  return true;
}

/* ---------- loop ---------- */
let running = false, busy = false, hasPose = false, lastSeen = -10, now = 0, tRise = -1, prev = performance.now();
const one = new THREE.Vector3();
async function track() {
  if (busy || !vw || video.readyState < 2) return;
  busy = true;
  try {
    const c = await detect();
    if (c && poseFrom(c)) {
      if (!hasPose || now - lastSeen > 1.5) { pos.copy(tPos); quat.copy(tQuat); }
      if (tRise < 0) tRise = 0;
      hasPose = true; lastSeen = now;
    }
  } finally { busy = false; }
}
function frame(ts) {
  requestAnimationFrame(frame);
  const dt = Math.min((ts - prev) / 1000, 0.05); prev = ts;
  if (!running) return;
  now += dt; track();
  const seen = hasPose && now - lastSeen < 1.2;
  site.visible = seen;
  hintEl.classList.toggle("hide", seen); frameEl.classList.toggle("hide", seen);
  if (seen) {
    const k = 1 - Math.pow(0.0005, dt);
    pos.lerp(tPos, k); quat.slerp(tQuat, k);
    tRise += dt;
    const p = Math.min(tRise / 0.5, 1), s = Math.max(1 + 2.4 * Math.pow(p - 1, 3) + 1.4 * Math.pow(p - 1, 2), 0.001);
    const rv = THREE.MathUtils.clamp((tRise - 0.3) / 2.6, 0, 1), ease = 1 - Math.pow(1 - rv, 3), hNow = ease * (BH + 0.25);
    site.matrix.compose(pos, quat, one.setScalar(s)); site.matrixWorldNeedsUpdate = true;
    clip.normal.set(0, -1, 0); clip.constant = rv >= 1 ? 1e4 : hNow + 0.001;
    if (rv < 1) clip.applyMatrix4(site.matrix);
    scanRing.position.y = hNow; scanRing.visible = rv > 0 && rv < 1;
    scanRing.children.forEach((c, i) => { c.material.opacity = [1, 0.35, 0.35][i] * Math.min(1, (1 - rv) * 6); });
  }
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);
addEventListener("pointerdown", () => { if (running && tRise > 3.2) tRise = 0; });   // tap to replay the rise

goBtn.addEventListener("click", async () => {
  goBtn.disabled = true; errEl.classList.remove("show");
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error("no-camera-api");
    await startCamera();
    startEl.classList.add("hide"); hintEl.classList.remove("hide"); frameEl.classList.remove("hide");
    running = true;
  } catch (e) {
    errEl.textContent = e && e.name === "NotAllowedError"
      ? "Камерын зөвшөөрөл өгөөгүй байна. Хөтчийн тохиргооноос камерыг зөвшөөрөөд дахин оролдоно уу."
      : "Камер асаах боломжгүй байна. Энэ хуудсыг Safari эсвэл Chrome хөтчөөр нээнэ үү.";
    errEl.classList.add("show"); goBtn.disabled = false;
  }
});
goBtn.click();   // ask for the camera straight away; the button stays as a fallback if the browser refuses
</script>
